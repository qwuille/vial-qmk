name: Replicazeron release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-firmware:
    name: Build firmware
    runs-on: ubuntu-24.04
    container: ghcr.io/qmk/qmk_cli@sha256:b7d7fa8fb4432b569931de5ad59098cb788f440ed61a62c5126746b71aee0f4a
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build all maintained Replicazeron variants
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p release

          qmk compile -c -kb handwired/replicazeron/stm32f103 -km vial
          cp handwired_replicazeron_stm32f103_vial.bin release/

          qmk compile -c -kb handwired/replicazeron/stm32f103 -km vial \
            -e REPLICAZERON_STM32_DIRECTINPUT=yes
          cp handwired_replicazeron_stm32f103_vial.bin \
            release/handwired_replicazeron_stm32f103_directinput_vial.bin

          qmk compile -c -kb handwired/replicazeron/rp2040 -km vial
          cp handwired_replicazeron_rp2040_vial.uf2 release/

      - uses: actions/upload-artifact@v7
        with:
          name: replicazeron-firmware
          path: |
            release/*.bin
            release/*.uf2
          if-no-files-found: error

  build-cad-bridge:
    name: Build Windows CAD bridge
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/replicazeron-cad-bridge/requirements.txt

      - name: Install bridge build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          python -m pip install -r tools/replicazeron-cad-bridge/requirements.txt pyinstaller==6.22.3

      - name: Test bridge
        shell: pwsh
        working-directory: tools/replicazeron-cad-bridge
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m unittest discover -s tests -v

      - name: Build self-contained executable
        shell: pwsh
        working-directory: tools/replicazeron-cad-bridge
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pyinstaller --clean --noconfirm --onefile --windowed --name ReplicazeronCadBridge --hidden-import hid --hidden-import pystray._win32 bridge.py
          .\dist\ReplicazeronCadBridge.exe --self-test
          .\package-windows.ps1 -Executable .\dist\ReplicazeronCadBridge.exe -OutputDirectory .\release

      - uses: actions/upload-artifact@v7
        with:
          name: replicazeron-cad-bridge-windows
          path: |
            tools/replicazeron-cad-bridge/release/ReplicazeronCadBridge.exe
            tools/replicazeron-cad-bridge/release/ReplicazeronFusion-windows.zip
            tools/replicazeron-cad-bridge/release/ReplicazeronFreeCAD-windows.zip
          if-no-files-found: error

  publish:
    needs: [build-firmware, build-cad-bridge]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: replicazeron-firmware
          path: release

      - uses: actions/download-artifact@v7
        with:
          name: replicazeron-cad-bridge-windows
          path: release

      - name: Create checksums
        run: (cd release && sha256sum *.bin *.uf2 *.exe *.zip > SHA256SUMS.txt)

      - name: Create release if needed and upload files
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Replicazeron $RELEASE_TAG" \
              --notes "The STM32 Standard build is recommended. The Windows CAD add-in packages include a self-contained system-tray bridge that Fusion or FreeCAD starts automatically and closes after the CAD applications exit; Python is not required."
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --clobber release/*
