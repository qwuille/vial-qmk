name: CI
on: [pull_request, push, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test-cad-bridge:
    name: Test CAD bridge
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check Python sources and bridge protocol
        run: |
          python3 -m compileall -q tools/replicazeron-cad-bridge
          python3 -m unittest discover -s tools/replicazeron-cad-bridge/tests -v

  package-cad-bridge:
    name: Package Windows CAD bridge
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/replicazeron-cad-bridge/requirements.txt

      - name: Install bridge build dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          python -m pip install -r tools/replicazeron-cad-bridge/requirements.txt pyinstaller==6.22.3

      - name: Build and test executable
        working-directory: tools/replicazeron-cad-bridge
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m unittest discover -s tests -v
          pyinstaller --clean --noconfirm --onefile --windowed --name ReplicazeronCadBridge --hidden-import hid --hidden-import pystray._win32 bridge.py
          .\dist\ReplicazeronCadBridge.exe --self-test
          .\package-windows.ps1 -Executable .\dist\ReplicazeronCadBridge.exe -OutputDirectory .\release

      - uses: actions/upload-artifact@v7
        with:
          name: replicazeron-cad-bridge-windows
          path: |
            tools/replicazeron-cad-bridge/release/ReplicazeronCadBridge.exe
            tools/replicazeron-cad-bridge/release/ReplicazeronFusion-windows.zip
            tools/replicazeron-cad-bridge/release/ReplicazeronFreeCAD-windows.zip
          if-no-files-found: error

  package-cad-bridge-linux:
    name: Package experimental Linux CAD bridge
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/replicazeron-cad-bridge/requirements.txt

      - name: Install bridge build dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r tools/replicazeron-cad-bridge/requirements.txt pyinstaller==6.22.3

      - name: Build and test experimental executable
        working-directory: tools/replicazeron-cad-bridge
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          pyinstaller --clean --noconfirm --onefile --name ReplicazeronCadBridge --hidden-import hid --hidden-import pystray._xorg bridge.py
          ./dist/ReplicazeronCadBridge --self-test
          ./package-linux.sh ./dist/ReplicazeronCadBridge ./release

      - uses: actions/upload-artifact@v7
        with:
          name: replicazeron-cad-bridge-linux
          path: |
            tools/replicazeron-cad-bridge/release/ReplicazeronCadBridge-linux-x86_64
            tools/replicazeron-cad-bridge/release/ReplicazeronFreeCAD-linux-x86_64.tar.gz
          if-no-files-found: error

  check-uid:
    name: Check Vial UIDs
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify Vial UID is unique per keyboard
        run: python3 util/ci_vial_verify_uid.py

  build-firmware:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container: ghcr.io/qmk/qmk_cli@sha256:b7d7fa8fb4432b569931de5ad59098cb788f440ed61a62c5126746b71aee0f4a
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: STM32F103 Vial
            keyboard: handwired/replicazeron/stm32f103
            directinput: false
          - name: STM32F103 DirectInput Vial
            keyboard: handwired/replicazeron/stm32f103
            directinput: true
          - name: RP2040 Vial
            keyboard: handwired/replicazeron/rp2040
            directinput: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Build maintained firmware
        shell: bash
        env:
          KEYBOARD: ${{ matrix.keyboard }}
          DIRECTINPUT: ${{ matrix.directinput }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          options=()
          if [[ "$DIRECTINPUT" == "true" ]]; then
            options+=("-e" "REPLICAZERON_STM32_DIRECTINPUT=yes")
          fi
          qmk compile -c -kb "$KEYBOARD" -km vial "${options[@]}"
